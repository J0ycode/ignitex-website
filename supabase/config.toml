
# Verifies a team's payment and emails their ticket. Called from /admin with
# the organiser's session, so JWT verification stays ON.
[functions.send-ticket]
enabled = true
verify_jwt = true
entrypoint = "./functions/send-ticket/index.ts"

# Called by the teams_notify_admins DB trigger with a shared secret header.
[functions.notify-admins]
enabled = true
verify_jwt = false
entrypoint = "./functions/notify-admins/index.ts"

# Shared desk login for /registration. Called before sign-in, so no JWT;
# checks CHECKIN_USERNAME / CHECKIN_PASSWORD itself, with rate limiting.
[functions.checkin-login]
enabled = true
verify_jwt = false
entrypoint = "./functions/checkin-login/index.ts"

# Final-round selection email. Called from /admin with the organiser's session.
[functions.send-selection]
enabled = true
verify_jwt = true
entrypoint = "./functions/send-selection/index.ts"

# Emails a team's certificates PDF: leader first, next member if that fails.
# Called from /admin/participation and /admin/certificates with the organiser's session.
[functions.send-certificates]
enabled = true
verify_jwt = true
entrypoint = "./functions/send-certificates/index.ts"
