
# Verifies a team's payment and emails their ticket. Called from /admin with
# the organiser's session, so JWT verification stays ON.
[functions.send-ticket]
enabled = true
verify_jwt = true
entrypoint = "./functions/send-ticket/index.ts"

# Called by the teams_notify_admins DB trigger with a shared secret header.
[functions.notify-admins]
enabled = true
verify_jwt = false
entrypoint = "./functions/notify-admins/index.ts"

[functions.paisa-create]
enabled = true
verify_jwt = false
import_map = "./functions/paisa-create/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/paisa-create/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/paisa-create/*.html" ]

[functions.paisa-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/paisa-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/paisa-webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/paisa-webhook/*.html" ]
